worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  keepalive_timeout 20;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    error_page 403 /erros/403.html;
    error_page 404 /erros/404.html;
    error_page 429 /erros/429.html;
    error_page 405 /erros/405.html;
    error_page 500 502 503 504 /erros/500.html;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
      return 405;
    }

    location = / {
      return 404;
    }

    location ~ /\.(?!well-known) {
      return 404;
    }

    location ~* \.(?:env|lock|md|sql|ts|tsx|map|ya?ml|toml|ini|conf)$ {
      return 404;
    }

    location ~ ^/erros/(?:403|404|405|429|500)\.html$ {
      expires -1;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf|css|js|webmanifest)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location / {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Access-Control-Allow-Origin "*" always;
    }
  }
}
